# Kuramoto-Sivashinsky prototype (ks/). Standard chaotic case L = 22 (Kassam & Trefethen; Lyapunov exponent ~0.05,
# Lyapunov time ~20, attractor dimension ~8). Solver step h = 0.25 (ETDRK4), emulator step dt = 0.5 (2 solver steps),
# so one Lyapunov time is ~40 emulator steps. Windows and horizons are in time units.
L: 22.0
N: 64
h: 0.25
dt: 0.5
transient: 100.0        # spin-up per start (time units)
seed_train: 1000
seed_test: 2000
n_train: 16384          # training starts
n_test: 2048            # held-out starts
n_eval: 1024            # held-out starts used for the training-time evaluation and the diagnostics
p_train: 40             # training trajectories: p_train emulator steps (= 20 time units = 1 Lyapunov time)
T_eval: 10.0            # held-out free-rollout error logged over [0, T_eval] (20 steps, ~0.5 Lyapunov time)
horizon: 80.0           # held-out trajectories (time units; 160 steps)
long_horizons: [5.0, 10.0, 20.0, 40.0, 80.0]

hidden: [256, 256, 256]
act: silu
lr: 1.0e-3
lr_end: 1.0e-6
warmup: 500
steps: 8000
clip: 1.0
batch: 1024
log_every: 250
threads: 8
out_root: ${SCRATCH}/multistep_roughness
